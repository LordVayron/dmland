<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#f6f1ea;--ink2:#c9bfb4;--ink3:#8f857b;--amber:linear-gradient(135deg,#f6b73f,#f0693a);--violet:linear-gradient(135deg,#9a76f5,#6a3fd4);--rose:linear-gradient(135deg,#ee6f8c,#d63f8a);--blue:linear-gradient(135deg,#4f9bff,#6a6cf0);--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.16)}
html,body{width:1280px;height:640px;overflow:hidden}
body{font-family:'Manrope',system-ui,sans-serif;color:var(--ink);background:#1b1319;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(900px 520px at 6% -5%,#7d4b3b 0%,transparent 62%),radial-gradient(760px 520px at 102% -8%,#e3a23c 0%,transparent 56%),radial-gradient(900px 640px at 104% 104%,#6a3fd4 0%,transparent 58%),radial-gradient(600px 400px at -4% 110%,#a23a6a 0%,transparent 60%),#1b1319}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:26px;backdrop-filter:blur(14px);box-shadow:0 24px 60px rgba(0,0,0,.35)}
.wm{display:flex;align-items:center;gap:14px;font-weight:800;letter-spacing:-.5px}
.grad{background:linear-gradient(100deg,#f6b73f,#ee6f8c 55%,#9a76f5);-webkit-background-clip:text;background-clip:text;color:transparent}

.l{position:absolute;left:70px;top:0;bottom:0;width:520px;display:flex;flex-direction:column;justify-content:center;gap:22px}
.wm{font-size:34px}h1{font-size:58px;line-height:1.03;font-weight:800;letter-spacing:-1.5px}p{font-size:21px;color:var(--ink2);font-weight:500;line-height:1.4}
.chips{display:flex;gap:10px;margin-top:6px}.chip{padding:9px 16px;border-radius:99px;background:var(--glass);border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--ink2)}
.win{position:absolute;left:600px;top:70px;width:760px;height:560px;border-radius:26px;overflow:hidden;transform:perspective(1400px) rotateY(-14deg) rotateX(4deg) rotate(-1.5deg);box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.18);border:1px solid var(--line)}
.win img{width:1100px;display:block}</style></head><body><div class="bg"></div>
<div class="l"><div class="wm"><svg width="46" height="46" viewBox="0 0 40 40"><defs><linearGradient id="lg46" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6b73f"/><stop offset=".55" stop-color="#e0587a"/><stop offset="1" stop-color="#7b5ad6"/></linearGradient></defs><path d="M20 3C10.6 3 3 9.9 3 18.4c0 4.6 2.2 8.7 5.7 11.5L7.6 37l6.8-3.4c1.8.5 3.6.8 5.6.8 9.4 0 17-6.9 17-15.4S29.4 3 20 3z" fill="url(#lg46)"/><circle cx="13" cy="18.5" r="2.4" fill="#fff"/><circle cx="20" cy="18.5" r="2.4" fill="#fff"/><circle cx="27" cy="18.5" r="2.4" fill="#fff"/></svg><span>DMLand</span></div><h1>Turn Instagram comments into <span class="grad">DMs</span>.</h1><p>Someone comments your keyword. DMLand replies and sends them your link. Self-hosted and free.</p><div class="chips"><span class="chip">Zero dependencies</span><span class="chip">Multi-brand</span><span class="chip">Email capture</span></div></div>
<div class="win"><img src="../screenshots/home.png"></div></body></html>
